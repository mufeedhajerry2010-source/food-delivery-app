<!DOCTYPE html>
<html>
<head>
  <title>My Food Delivery App</title>
  <style>
    body {
      background-color: #F8F9FA;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 40px 0;
    }

    .phone-screen {
      width: 340px;
    }

    /* Top Header Row (Location + Live Cart Counter) */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .location {
      font-size: 14px;
      font-weight: bold;
      color: #222;
    }

    /* Live Cart Badge */
    .cart-badge {
      background-color: #222;
      color: white;
      font-size: 12px;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 20px;
    }

    .search-bar {
      width: 100%;
      height: 44px;
      padding: 0 16px;
      border: none;
      border-radius: 12px;
      background-color: #FFFFFF;
      box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.08);
      font-size: 14px;
      margin-bottom: 20px;
      box-sizing: border-box;
    }

    .promo-banner {
      background-color: #FF5722;
      color: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.15);
      margin-bottom: 24px;
    }

    .promo-banner h1 {
      margin: 0;
      font-size: 28px;
      font-weight: bold;
    }

    .promo-banner p {
      margin: 8px 0 16px 0;
      font-size: 14px;
    }

    .order-btn {
      background-color: white;
      color: #FF5722;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .section-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #222;
    }

    .restaurant-card {
      background-color: #FFFFFF;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0px 6px 16px rgba(0, 0, 0, 0.08);
      margin-bottom: 16px;
    }

    .food-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .card-info {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .restaurant-name {
      margin: 0 0 4px 0;
      font-size: 16px;
      font-weight: bold;
      color: #222;
    }

    .restaurant-meta {
      margin: 0;
      font-size: 12px;
      color: #757575;
    }

    .add-btn {
      background-color: #FF5722;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }

    /* Button changes color briefly when clicked */
    .add-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div class="phone-screen">
    <!-- Top Bar with Live Cart Counter -->
    <div class="top-bar">
      <div class="location">Deliver to: Home ▾</div>
      <div class="cart-badge">🛒 Cart: <span id="cart-count">0</span></div>
    </div>

    <!-- Search Bar -->
    <input type="text" class="search-bar" placeholder="Search for biryani, pizza...">

    <!-- Orange 50% OFF Banner -->
    <div class="promo-banner">
      <h1>50% OFF</h1>
      <p>On your first order</p>
      <button class="order-btn" onclick="alert('50% Coupon Applied!')">Claim Offer</button>
    </div>

    <!-- Restaurant Card Section -->
    <div class="section-title">Popular Near You</div>

    <div class="restaurant-card">
      <img class="food-img" src="https://unsplash.com" alt="Biryani">
      <div class="card-info">
        <div>
          <h3 class="restaurant-name">Royal Biryani House</h3>
          <p class="restaurant-meta">★ 4.5 • 25 mins • ₹200 for one</p>
        </div>
        <button class="add-btn" onclick="addToCart()">Order +</button>
      </div>
    </div>
  </div>

  <!-- Real JavaScript Logic -->
  <script>
    let count = 0;

    function addToCart() {
      count = count + 1;
      document.getElementById("cart-count").innerText = count;
    }
  </script>

</body>
</html>
